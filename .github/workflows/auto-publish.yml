name: Daily Article Generation

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

# Required to push commits back to repo
permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: oldgamerai-del/tircha-backend
          path: tircha-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r tircha-backend/requirements.txt

      - name: Generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADINGVIEW_AFFILIATE_URL: ${{ secrets.TRADINGVIEW_AFFILIATE_URL }}
          JASPER_AFFILIATE_URL: ${{ secrets.JASPER_AFFILIATE_URL }}
          NORDVPN_AFFILIATE_URL: ${{ secrets.NORDVPN_AFFILIATE_URL }}
          RAZER_AFFILIATE_URL: ${{ secrets.RAZER_AFFILIATE_URL }}
        run: cd tircha-backend && python automation.py

      - name: Commit and push new articles
        run: |
          git config --global user.email "bot@tircha.com"
          git config --global user.name "Tircha Bot"
          git add content/blog/
          git diff --staged --quiet || git commit -m "Auto: New articles $(date +%Y-%m-%d-%H%M)"
          git push
