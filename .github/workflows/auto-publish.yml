name: Auto Generate & Publish Articles

on:
  schedule:
    - cron: '0 6 * * *'    # runs every day at 6 AM automatically
    - cron: '0 14 * * *'   # runs every day at 2 PM automatically
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tircha-frontend
        uses: actions/checkout@v4

      - name: Checkout tircha-backend
        uses: actions/checkout@v4
        with:
          repository: oldgamerai-del/tircha-backend
          path: tircha-backend

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r tircha-backend/requirements.txt

      - name: Generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADINGVIEW_AFFILIATE_URL: ${{ secrets.TRADINGVIEW_AFFILIATE_URL }}
          JASPER_AFFILIATE_URL: ${{ secrets.JASPER_AFFILIATE_URL }}
          NORDVPN_AFFILIATE_URL: ${{ secrets.NORDVPN_AFFILIATE_URL }}
          RAZER_AFFILIATE_URL: ${{ secrets.RAZER_AFFILIATE_URL }}
        run: cd tircha-backend && python automation.py

      - name: Publish new articles to website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config -global user.email "bot@tircha.com"
          git config -global user.name "Tircha Bot"
          git add content/blog/
          git diff --staged --quiet || git commit -m "Auto: New articles $(date +%Y-%m-%d)"
          git push
