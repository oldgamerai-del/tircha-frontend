name: Daily Article Generation

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: oldgamerai-del/tircha-backend
          path: tircha-backend
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install aiohttp python-dotenv

      - name: Generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADINGVIEW_AFFILIATE_URL: ${{ secrets.TRADINGVIEW_AFFILIATE_URL }}
          JASPER_AFFILIATE_URL: ${{ secrets.JASPER_AFFILIATE_URL }}
          NORDVPN_AFFILIATE_URL: ${{ secrets.NORDVPN_AFFILIATE_URL }}
          RAZER_AFFILIATE_URL: ${{ secrets.RAZER_AFFILIATE_URL }}
        run: cd tircha-backend && python automation.py

      - name: Push new articles
        run: |
          git config --global user.email "bot@tircha.com"
          git config --global user.name "Tircha Bot"
          git fetch origin master
          git reset --hard origin/master
          git add frontend/content/blog/
          git diff --staged --quiet || git commit -m "Auto: New article $(date +%Y-%m-%d-%H%M)"
          git push origin master
